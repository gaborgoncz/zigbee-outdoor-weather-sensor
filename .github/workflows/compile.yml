name: Compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile firmware for XIAO ESP32-C6 (Zigbee end device)
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32C6:PartitionScheme=zigbee,ZigbeeMode=ed
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.11
          libraries: |
            - name: Adafruit AHTX0
            - name: Adafruit BMP280 Library
          sketch-paths: |
            - xiao_c6_outdoor_sensor
