<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Wiring of the XIAO ESP32-C6 outdoor sensor</title>
<desc>A single Li-ion cell on the BAT pads, a two-resistor divider with a capacitor feeding pin A0, an AHT20 plus BMP280 module on 3V3, GND, D4 (SDA) and D5 (SCL), and an external antenna on the U.FL connector.</desc>
<rect width="680" height="330" rx="10" fill="#FCFCFA"/>

<!-- battery -->
<rect x="30" y="172" width="100" height="46" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="80" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Li-ion cell</text>
<text x="80" y="211" text-anchor="middle" font-size="12" fill="#854F0B">1S, 3.0–4.2 V</text>

<!-- rails -->
<path d="M80 172 V110 H320" fill="none" stroke="#E24B4A" stroke-width="2"/>
<path d="M80 218 V280 H320" fill="none" stroke="#5F5E5A" stroke-width="2"/>

<!-- divider -->
<line x1="190" y1="110" x2="190" y2="125" stroke="#E24B4A" stroke-width="2"/>
<rect x="178" y="125" width="24" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<line x1="190" y1="169" x2="190" y2="212" stroke="#EF9F27" stroke-width="2"/>
<rect x="178" y="212" width="24" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<line x1="190" y1="256" x2="190" y2="280" stroke="#5F5E5A" stroke-width="2"/>
<text x="170" y="151" text-anchor="end" font-size="12" fill="#444441">R1 1 MΩ</text>
<text x="170" y="242" text-anchor="end" font-size="12" fill="#444441">R2 1 MΩ</text>

<!-- sense wire and capacitor -->
<line x1="190" y1="190" x2="320" y2="190" stroke="#EF9F27" stroke-width="2"/>
<line x1="250" y1="190" x2="250" y2="228" stroke="#EF9F27" stroke-width="2"/>
<line x1="238" y1="228" x2="262" y2="228" stroke="#EF9F27" stroke-width="2.5"/>
<line x1="238" y1="236" x2="262" y2="236" stroke="#5F5E5A" stroke-width="2.5"/>
<line x1="250" y1="236" x2="250" y2="280" stroke="#5F5E5A" stroke-width="2"/>
<text x="268" y="236" font-size="12" fill="#444441">100 nF</text>

<!-- junctions -->
<circle cx="190" cy="110" r="3.5" fill="#E24B4A"/>
<circle cx="190" cy="190" r="3.5" fill="#EF9F27"/>
<circle cx="250" cy="190" r="3.5" fill="#EF9F27"/>
<circle cx="190" cy="280" r="3.5" fill="#5F5E5A"/>
<circle cx="250" cy="280" r="3.5" fill="#5F5E5A"/>

<!-- antenna -->
<path d="M390 70 V38 M380 26 L390 38 L400 26" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round"/>
<text x="408" y="40" font-size="12" fill="#444441">External antenna (U.FL)</text>

<!-- XIAO -->
<rect x="320" y="70" width="140" height="235" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<g font-size="12" fill="#0C447C">
  <text x="330" y="114">BAT+</text>
  <text x="330" y="194">A0 (D0)</text>
  <text x="330" y="284">BAT−</text>
  <text x="450" y="114" text-anchor="end">3V3</text>
  <text x="450" y="164" text-anchor="end">D4 SDA</text>
  <text x="450" y="214" text-anchor="end">D5 SCL</text>
  <text x="450" y="284" text-anchor="end">GND</text>
</g>
<text x="390" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">XIAO</text>
<text x="390" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">ESP32-C6</text>

<!-- sensor wires -->
<line x1="460" y1="110" x2="540" y2="110" stroke="#E24B4A" stroke-width="2"/>
<line x1="460" y1="160" x2="540" y2="160" stroke="#378ADD" stroke-width="2"/>
<line x1="460" y1="210" x2="540" y2="210" stroke="#1D9E75" stroke-width="2"/>
<line x1="460" y1="280" x2="540" y2="280" stroke="#5F5E5A" stroke-width="2"/>

<!-- sensor module -->
<rect x="540" y="85" width="120" height="220" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<g font-size="12" fill="#085041">
  <text x="550" y="114">VCC</text>
  <text x="550" y="164">SDA</text>
  <text x="550" y="214">SCL</text>
  <text x="550" y="284">GND</text>
</g>
<text x="600" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">AHT20 +</text>
<text x="600" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">BMP280</text>
</svg>
